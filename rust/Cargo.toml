[workspace]
resolver = "2"
members = ["php-rt", "generated/*", "debug"]

# Iteration builds: no optimization, no LTO, many codegen units, line tables only for backtraces.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false
codegen-units = 256
lto = "off"

[profile.test]
inherits = "dev"

# Only for final measurements, never while iterating.
[profile.release]
opt-level = 2
debug = 1
codegen-units = 32
lto = "off"

# Running the test suite: light optimization, still no LTO and many codegen units so builds stay feasible.
[profile.fast]
inherits = "dev"
opt-level = 1

[profile.fast.package.php-rt]
opt-level = 3
